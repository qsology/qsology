# The CloudNativePG operator. Its backup plugin is its own layer
# (deploy/operators/barman-cloud), as it needs cert-manager too
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: ${CLOUDNATIVE_PG_NAMESPACE}
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1 # operator 1.30.1
      sourceRef:
        kind: HelmRepository
        name: qsology-cloudnative-pg
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    replicaCount: 2
