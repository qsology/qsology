# External Secrets Operator, which copies secrets out of OpenBao into
# Kubernetes Secrets for the apps (see infrastructure/openbao)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: ${EXTERNAL_SECRETS_NAMESPACE}
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: 2.12.0
      sourceRef:
        kind: HelmRepository
        name: qsology-external-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    installCRDs: true
    serviceAccount:
      name: ${EXTERNAL_SECRETS_SERVICE_ACCOUNT}
    replicaCount: 2
    leaderElect: true
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
