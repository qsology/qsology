# Only the CRDs from prometheus-operator (ServiceMonitor, PodMonitor, ...),
# no operator: Alloy reads the monitors and does the scraping. Nothing
# runs, so the release lives in flux-system.
#
# Uninstalling the chart deletes the CRDs and every monitor with them, so
# Flux never prunes it
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-operator-crds
      version: 32.0.1 # prometheus-operator 0.94.1
      sourceRef:
        kind: HelmRepository
        name: qsology-prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
