# kube-state-metrics: the state of Kubernetes objects as metrics (pods
# restarting or OOM killed, deployments short of replicas, failed jobs,
# HPAs at their limit), which the alerts in deploy/monitoring/alerts use.
# Alloy scrapes it through its ServiceMonitor
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: qsology-observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.6.0 # kube-state-metrics 2.20.0
      sourceRef:
        kind: HelmRepository
        name: qsology-prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    fullnameOverride: kube-state-metrics
    image:
      sha: "sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    prometheus:
      monitor:
        enabled: true
        http:
          interval: 60s
          # Its labels (namespace, pod, ...) are about the objects, not
          # about kube-state-metrics
          honorLabels: true
