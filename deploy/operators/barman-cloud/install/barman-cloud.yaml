# CloudNativePG's Barman Cloud plugin, which archives WAL and takes base
# backups to object storage (here RustFS). Needs cert-manager, and must be
# in the operator's namespace
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: ${CLOUDNATIVE_PG_NAMESPACE}
spec:
  interval: 1h
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1 # plugin v0.15.1
      sourceRef:
        kind: HelmRepository
        name: qsology-cloudnative-pg
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
