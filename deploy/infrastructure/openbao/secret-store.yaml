# How the External Secrets Operator reads OpenBao: logging in with its own
# service account (Kubernetes auth, role external-secrets) and reading the
# KV v2 mount "secret". Not ready until OpenBao is set up, see
# deploy/README.md
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: qsology-openbao
spec:
  provider:
    openBao:
      server: https://openbao-active.qsology-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-server-tls
        namespace: qsology-openbao
        key: ca.crt
      auth:
        kubernetes:
          path: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: ${EXTERNAL_SECRETS_SERVICE_ACCOUNT}
            namespace: ${EXTERNAL_SECRETS_NAMESPACE}
  # Only the namespaces that need secrets from it
  conditions:
    - namespaces:
        - qsology
