# Secrets for the app, read from OpenBao (KV v2 mount "secret") by the
# External Secrets Operator. See deploy/README.md for writing them
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qsology-env
  namespace: qsology
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: qsology-openbao
  target:
    name: qsology-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DJANGO_SECRET_KEY: "{{ .django_secret_key }}"
        # Valkey's primary, through HAProxy. Database 0 is the celery
        # broker, 1 the cache
        CELERY_BROKER_URL: "redis://qsology:{{ .valkey_password | urlquery }}@valkey-haproxy.qsology.svc:6379/0"
        DJANGO_CACHE_URL: "redis://qsology:{{ .valkey_password | urlquery }}@valkey-haproxy.qsology.svc:6379/1"
        QSOLOGY_EXPORTS_S3_ACCESS_KEY: "{{ .exports_access_key }}"
        QSOLOGY_EXPORTS_S3_SECRET_KEY: "{{ .exports_secret_key }}"
  data:
    - secretKey: django_secret_key
      remoteRef:
        key: qsology/django
        property: secret_key
    - secretKey: valkey_password
      remoteRef:
        key: qsology/valkey
        property: qsology
    - secretKey: exports_access_key
      remoteRef:
        key: qsology/rustfs-exports
        property: access_key
    - secretKey: exports_secret_key
      remoteRef:
        key: qsology/rustfs-exports
        property: secret_key
