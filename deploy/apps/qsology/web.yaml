# The Django app, behind the gateway. Never fewer than 3 pods, spread over
# nodes where there are enough of them
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qsology-web
  namespace: qsology
  labels:
    app.kubernetes.io/name: qsology
    app.kubernetes.io/component: web
spec:
  # No replicas here, the autoscaler below owns them (never fewer than 3)
  # and Flux would otherwise keep putting them back
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qsology
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qsology
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: qsology
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: qsology
              app.kubernetes.io/component: web
      containers:
        - name: web
          image: ${QSOLOGY_IMAGE}
          command: ["gunicorn", "config.wsgi:application"]
          ports:
            - name: http
              containerPort: 8000
            # Prometheus metrics, served by gunicorn's master for all the
            # workers (config/prometheus.py). Not behind the gateway
            - name: metrics
              containerPort: 9100
          env:
            - name: OTEL_SERVICE_NAME
              value: qsology-web
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /run/prometheus
            - name: METRICS_PORT
              value: "9100"
            - name: DJANGO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qsology-db-app
                  key: uri
          envFrom:
            - configMapRef:
                name: qsology-config
            - secretRef:
                name: qsology-env
          # Started once the database answers, then kept in the load
          # balancer only while it still does
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Let the gateway stop sending requests before gunicorn stops
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: metrics
              mountPath: /run/prometheus
            - name: db-ca
              mountPath: /etc/qsology/db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        # The workers' metric files, emptied whenever gunicorn starts
        - name: metrics
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: db-ca
          secret:
            secretName: qsology-db-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: qsology-web
  namespace: qsology
  labels:
    app.kubernetes.io/name: qsology
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: qsology
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qsology-web
  namespace: qsology
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qsology
      app.kubernetes.io/component: web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qsology-web
  namespace: qsology
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qsology-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
