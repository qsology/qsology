apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qsology
  namespace: qsology
spec:
  parentRefs:
    - name: public
      namespace: qsology-gateway
      sectionName: qsology
  hostnames:
    - "${QSOLOGY_DOMAIN}"
  rules:
    - backendRefs:
        - name: qsology-web
          port: 8000
      timeouts:
        # A little over gunicorn's own timeout, slow work goes to celery
        request: 75s
