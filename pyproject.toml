[project]
name = "qsology"
version = "2026.01"
description = "Ham Radio logger"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<7",
    "psycopg[binary]>=3.3",
    "environs[django]>=15",
    "whitenoise>=6.12.0",
    "celery>=5.5",
    # The Django cache (Valkey), celery uses RabbitMQ
    "redis>=6",
    "requests>=2.32",
    "django-storages[s3]>=1.14",
    "gunicorn>=23",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-django>=0.66b1",
    "opentelemetry-instrumentation-celery>=0.66b1",
    "opentelemetry-instrumentation-psycopg>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-instrumentation-botocore>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "prometheus-client>=0.23",
    "django-ninja>=1.7.1,<1.8",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15",
    "hypothesis>=6",
    "moto[s3]>=5",
    "playwright>=1.63,<1.64",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pyyaml>=6",
    "responses>=0.25",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 80
src = ["apps", "config", "tasks", "tests"]

[tool.ruff.lint]
# E/W - pycodestyle
# F pyflakes
# I isort
# UP pyupgrade
# B bugbear
# DJ django
# C4 comprehensions
# SIM simplify
# RUF ruff specifics
select = [ "E", "W", "F", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Migrations are auto generated, so we're going to ignore them
"**/migrations/*.py" = ["E501", "RUF012"]
# Django's Meta options (fields, labels, widgets) are plain class attributes
"**/forms.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--strict-markers --reuse-db"
markers = [
    "browser: runs in real browsers (tests/browser), needs task test:browsers",
]
testpaths = ["apps", "tests"]

[tool.uv]
# Hold back releases less than two weeks old that dependencies would pull in
constraint-dependencies = [
    "soupsieve<3.0.4",
]
