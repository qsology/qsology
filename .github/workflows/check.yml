# Every pull request into main must pass `task check` before it's merged.
# Keep in step with .forgejo/workflows/check.yml
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail rather than quietly re-lock if uv.lock is out of date
  UV_LOCKED: "1"
  UV_PYTHON_DOWNLOADS: automatic
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    name: task check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and task
        run: scripts/ci/install-tools.sh

      - name: Install dependencies
        run: uv sync --locked

      - name: task check
        run: task check

  # The Kubernetes manifests build, validate and render, see deploy/
  deploy:
    name: deploy check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and task
        run: scripts/ci/install-tools.sh --deploy

      - name: Install dependencies
        run: uv sync --locked

      - name: task deploy:check
        run: task deploy:check
